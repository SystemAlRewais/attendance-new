<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل الحضور الذكي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="admin-badge" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-green);">📍 نظام الحضور الجغرافي</div>
        <h2>تسجيل المحاضرة</h2>
        <p id="userInfo" style="color: var(--text-main); font-weight: 700; margin-bottom: 5px;"></p>
        <p id="attendanceSubject" style="font-weight: 600; color: #38bdf8; margin-bottom: 15px;"></p>
        
        <p id="lectureTitleDisplay" style="background:rgba(79, 70, 229, 0.1); border: 1px solid var(--border-color); padding:10px; border-radius:10px; font-weight:700; font-size:14px; margin-bottom: 20px;">جاري التحقق من حالة المحاضرة سحابياً...</p>

        <div id="attendanceForm">
            <div class="input-group">
                <label>الكود السري للمحاضرة:</label>
                <input type="password" id="secretCode" placeholder="أدخل كود المحاضرة (1234 أو 01500)">
            </div>

            <button type="button" class="btn" onclick="submitFinalAttendance()">تسجيل الحضور الآن</button>
        </div>

        <p id="statusMsg" class="status-msg"></p>

        <button type="button" class="btn btn-secondary" onclick="goBack()">العودة لاختيار المواد</button>

        <hr style="margin-top: 25px; border: 0.5px solid var(--border-color);">
        <a href="admin.html" style="display: block; margin-top: 15px; font-size: 13px; color: var(--text-sub); text-decoration: none;">🔐 لوحة تحكم الإدارة</a>
    </div>

    <script src="script.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('currentUser'));
        const subject = localStorage.getItem('selectedSubject');

        if(!user) {
            window.location.href = 'index.html';
        } else if(!subject) {
            window.location.href = 'subjects.html';
        } else {
            document.getElementById('userInfo').textContent = `الطالب: ${user.name} (ID: ${user.id})`;
            document.getElementById('attendanceSubject').textContent = `المادة: ${subject}`;
        }

        async function checkLiveAttendanceStatus() {
            try {
                const settings = await fetchAppSettings();
                if (settings) {
                    const title = settings.currentSubject || "المحاضرة الحالية";
                    document.getElementById('lectureTitleDisplay').textContent = `📌 ${title}`;

                    if (String(settings.isAttendanceOpen).trim() === 'false') {
                        document.getElementById('attendanceForm').style.display = 'none';
                        const msgEl = document.getElementById('statusMsg');
                        msgEl.style.color = 'var(--accent-red)';
                        msgEl.textContent = '🔒 باب تسجيل الحضور مغلق حالياً من قِبل الإدارة.';
                    } else {
                        document.getElementById('attendanceForm').style.display = 'block';
                        document.getElementById('statusMsg').textContent = '';
                    }
                }
            } catch(e) {
                console.error(e);
            }
        }

        checkLiveAttendanceStatus();

        function goBack() {
            window.location.href = 'subjects.html';
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c;
        }

        async function submitFinalAttendance() {
            const code = document.getElementById('secretCode').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!code) {
                alert("يرجى إدخال الكود السري للمحاضرة!");
                return;
            }

            const settings = await fetchAppSettings();
            if (String(settings.isAttendanceOpen).trim() === 'false') {
                alert("❌ عذراً، الإدارة أغلقت باب الحضور!");
                return;
            }

            // ⭐ 1. كود الاستثناء 01500 (يتجاوز الـ GPS فوراً وبدون أي شرط آخر) ⭐
            if (code === "01500") {
                statusMsg.style.color = "var(--accent-green)";
                statusMsg.textContent = "⚡ تم استخدام كود الاستثناء (01500). جاري تسجيل الحضور مباشرة...";
                sendAttendanceData("https://maps.google.com/?q=Bypass_01500", "Bypass_01500");
                return;
            }

            // ⭐ 2. التحقق من كود المحاضرة العادي 1234 ⭐
            if (code !== "1234") { 
                alert("❌ الكود السري للمحاضرة غير صحيح!");
                return;
            }

            // استثناء رقم الهاتف VIP (012288) لتجاوز GPS
            const userPhoneClean = String(user.phone || '').trim();
            if (userPhoneClean === "012288") {
                statusMsg.style.color = "var(--accent-green)";
                statusMsg.textContent = "⭐ تم التعرف على حساب الاستثناء VIP. جاري تسجيل الحضور مباشرة...";
                sendAttendanceData("https://maps.google.com/?q=VIP_Bypass_012288", "VIP");
                return;
            }

            // للطلاب العاديين بكود 1234: تحديد الموقع والتحقق من نطاق الكلية
            statusMsg.style.color = "#38bdf8";
            statusMsg.textContent = "📍 جاري تحديد موقعك الجغرافي والتحقق من النطاق...";

            if (!navigator.geolocation) {
                alert("متصفحك لا يدعم خاصية تحديد الموقع الجغرافي!");
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const locationLink = `https://maps.google.com/?q=${lat},${lon}`;

                const collegeLat = 30.0444; 
                const collegeLon = 31.2357; 
                const allowedRadiusMeters = 300; 

                const distance = calculateDistance(lat, lon, collegeLat, collegeLon);

                if (distance > allowedRadiusMeters) {
                    statusMsg.style.color = "var(--accent-red)";
                    statusMsg.textContent = `❌ أنت خارج نطاق الكلية (${Math.round(distance)} متر).`;
                    return;
                }

                sendAttendanceData(locationLink, "Normal");

            }, (error) => {
                statusMsg.style.color = "var(--accent-red)";
                statusMsg.textContent = "❌ فشل في تحديد موقع الـ GPS. تأكد من تفعيل الموقع في الجهاز.";
            });
        }

        async function sendAttendanceData(locationLink, typeStatus) {
            const statusMsg = document.getElementById('statusMsg');
            const timeStr = new Date().toLocaleString('ar-EG');

            statusMsg.textContent = "⏳ جاري تسجيل بيانات الحضور في SheetDB...";

            try {
                await fetch(`${sheetDBUrl}?sheet=attendance`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: [{
                            id: user.id,
                            name: user.name,
                            phone: user.phone,
                            grade: user.grade,
                            subject: subject,
                            time: timeStr,
                            locationLink: locationLink,
                            status: typeStatus
                        }]
                    })
                });

                statusMsg.style.color = "var(--accent-green)";
                statusMsg.textContent = "✅ تم تسجيل حضورك بنجاح وسماعه في الشيت!";
                alert("🎉 تم تسجيل حضورك بنجاح وسُجل في جوجل شيت!");
                setTimeout(() => { window.location.href = 'subjects.html'; }, 1500);

            } catch (e) {
                console.error(e);
                statusMsg.style.color = "var(--accent-red)";
                statusMsg.textContent = "❌ حدث خطأ أثناء إرسال البيانات للـ SheetDB.";
            }
        }
    </script>
</body>
</html>
