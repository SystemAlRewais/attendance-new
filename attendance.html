<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تسجيل الحضور - كلية الإعلام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="admin-badge" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-green);">📍 نظام الحضور الذكي</div>
        <h2>تسجيل المحاضرة</h2>
        <p id="userInfo" style="color: var(--text-main); font-weight: 700; margin-bottom: 5px;"></p>
        <p id="attendanceSubject" style="font-weight: 600; color: #38bdf8; margin-bottom: 15px;"></p>
        
        <p id="lectureTitleDisplay" style="background:rgba(79, 70, 229, 0.1); border: 1px solid var(--border-color); padding:10px; border-radius:10px; font-weight:700; font-size:14px; margin-bottom: 20px;">جاري التحقق من حالة المحاضرة سحابياً...</p>

        <div id="attendanceForm">
            <div class="input-group">
                <label>الكود السري للمحاضرة:</label>
                <input type="password" id="secretCode" placeholder="أدخل الكود المسلم من المحاضر">
            </div>

            <button type="button" class="btn" onclick="submitFinalAttendance()">تسجيل الحضور عبر الـ GPS</button>
        </div>

        <p id="statusMsg" class="status-msg"></p>

        <button type="button" class="btn btn-secondary" onclick="goBack()">العودة لاختيار المواد</button>

        <hr style="margin-top: 25px; border: 0.5px solid var(--border-color);">
        <a href="admin.html" style="display: block; margin-top: 15px; font-size: 13px; color: var(--text-sub); text-decoration: none;">🔐 لوحة تحكم الإدارة</a>
    </div>

    <script src="script.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('currentUser'));
        const subject = localStorage.getItem('selectedSubject');

        if(!user) {
            window.location.href = 'index.html';
        } else if(!subject) {
            window.location.href = 'subjects.html';
        } else {
            document.getElementById('userInfo').textContent = `الطالب: ${user.name} (ID: ${user.id})`;
            document.getElementById('attendanceSubject').textContent = `المادة المختارة: ${subject}`;
        }

        async function checkLiveAttendanceStatus() {
            try {
                const settings = await fetchAppSettings();
                if (settings) {
                    const title = settings.currentSubject || "المحاضرة الحالية";
                    document.getElementById('lectureTitleDisplay').textContent = `📌 ${title}`;

                    if (settings.isAttendanceOpen !== 'true') {
                        document.getElementById('attendanceForm').style.display = 'none';
                        const msgEl = document.getElementById('statusMsg');
                        msgEl.style.color = 'var(--accent-red)';
                        msgEl.textContent = '🔒 باب تسجيل الحضور مغلق حالياً من قِبل الإدارة.';
                    } else {
                        document.getElementById('attendanceForm').style.display = 'block';
                        document.getElementById('statusMsg').textContent = '';
                    }
                }
            } catch(e) {
                console.error("Error fetching settings:", e);
            }
        }

        checkLiveAttendanceStatus();

        function goBack() {
            window.location.href = 'subjects.html';
        }

        async function submitFinalAttendance() {
            const code = document.getElementById('secretCode').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            if (!code) {
                alert("يرجى إدخال الكود السري للمحاضرة!");
                return;
            }

            if (code !== "1234") { 
                alert("❌ الكود السري غير صحيح!");
                return;
            }

            statusMsg.style.color = "#38bdf8";
            statusMsg.textContent = "📍 جاري تحديد موقعك الجغرافي (GPS)...";

            if (!navigator.geolocation) {
                alert("متصفحك لا يدعم خاصية تحديد الموقع الجغرافي!");
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const locationLink = `https://maps.google.com/?q=${lat},${lon}`;
                const timeStr = new Date().toLocaleString('ar-EG');
                const isOutlier = "false"; 

                statusMsg.textContent = "⏳ جاري إرسال بيانات الحضور للشيت سحابياً...";

                try {
                    await fetch(webAppUrl, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "addAttendance",
                            id: user.id,
                            name: user.name,
                            phone: user.phone,
                            grade: user.grade,
                            subject: subject,
                            time: timeStr,
                            locationLink: locationLink,
                            isOutlier: isOutlier
                        })
                    });

                    statusMsg.style.color = "var(--accent-green)";
                    statusMsg.textContent = "✅ تم تسجيل حضورك بنجاح وحفظه في السيرفر!";
                    alert("🎉 تم تسجيل حضورك بنجاح!");
                    setTimeout(() => { window.location.href = 'subjects.html'; }, 1500);

                } catch (e) {
                    console.error(e);
                    statusMsg.style.color = "var(--accent-red)";
                    statusMsg.textContent = "❌ حدث خطأ أثناء الاتصال بالسيرفر.";
                }
            }, (error) => {
                statusMsg.style.color = "var(--accent-red)";
                statusMsg.textContent = "❌ فشل في تحديد موقع الـ GPS. تأكد من تفعيل الموقع في المتصفح.";
            });
        }
    </script>
</body>
</html>
