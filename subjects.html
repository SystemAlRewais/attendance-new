<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختر المادة الدراسية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 600px; text-align: center;">
        <div class="admin-badge" style="background: rgba(56, 189, 248, 0.1); color: #38bdf8;">🎓 المواد الدراسية المتاحة</div>
        <h2>اختر المادة لتسجيل الحضور</h2>
        <p id="welcomeStudent" style="color: var(--text-sub); margin-bottom: 25px;"></p>

        <!-- قائمة المواد الدراسية -->
        <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px;">
            <button class="btn" onclick="selectSubject('نشأة وسائل الاتصال')" style="background: #4f46e5; padding: 15px; font-size: 16px;">📚 نشأة وسائل الاتصال</button>
            <button class="btn" onclick="selectSubject('رأي عام')" style="background: #4f46e5; padding: 15px; font-size: 16px;">📚 رأي عام</button>
            <button class="btn" onclick="selectSubject('صحافة استقصائية')" style="background: #4f46e5; padding: 15px; font-size: 16px;">📚 صحافة استقصائية</button>
            <button class="btn" onclick="selectSubject('إذاعة وتلفزيون')" style="background: #4f46e5; padding: 15px; font-size: 16px;">📚 إذاعة وتلفزيون</button>
            <button class="btn" onclick="selectSubject('إعلان وترويج')" style="background: #4f46e5; padding: 15px; font-size: 16px;">📚 إعلان وترويج</button>
        </div>

        <button class="btn btn-secondary" onclick="logout()" style="background: var(--accent-red); margin-top: 10px;">🚪 تسجيل الخروج</button>
        
        <div style="margin-top: 25px;">
            <a href="admin.html" style="font-size: 13px; color: var(--text-sub); text-decoration: none;">🔐 لوحة تحكم الإدارة</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('welcomeStudent').textContent = `أهلاً بك، ${currentUser.name} (ID: ${currentUser.id})`;
        }

        function selectSubject(subjectName) {
            localStorage.setItem('selectedSubject', subjectName);
            window.location.href = 'attendance.html';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
