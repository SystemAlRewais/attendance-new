<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السحابية - كلية الإعلام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 540px;">
        <div class="admin-badge">⚡ لوحة الإدارة العليا</div>
        <h2>إدارة النظام السحابي</h2>
        <p id="adminWelcome">تحكم لحظي في الحالة الأكاديمية وصلاحيات الطلاب</p>

        <div class="card">
            <h3>🔘 حالة بوابات النظام (سحابياً)</h3>
            <p>التغيير ينعكس فوراً عند جميع الطلاب:</p>
            
            <button id="toggleAttendanceBtn" class="btn" style="background-color: #10b981; margin-bottom: 15px; font-weight: bold; padding: 14px;" onclick="handleToggleAttendance()">
                🔄 جاري جلب حالة الحضور...
            </button>

            <button id="toggleRegistrationBtn" class="btn" style="background-color: #10b981; margin-bottom: 15px; font-weight: bold; padding: 14px;" onclick="handleToggleRegistration()">
                🔄 جاري جلب حالة التسجيل...
            </button>
        </div>

        <div class="card">
            <h3>📚 المادة والمحاضرة الحالية</h3>
            <div class="input-group">
                <input type="text" id="adminSubjectInput" placeholder="أدخل اسم المحاضرة النشطة حالياً">
            </div>
            <button class="btn" onclick="saveSubject()">تحديث اسم المادة سحابياً</button>
        </div>

        <button class="btn btn-secondary" onclick="window.location.href='subjects.html'">العودة لمنصة المواد</button>
    </div>

    <script src="script.js"></script>
    <script>
        let isAttendanceOpenState = true;
        let isRegistrationOpenState = true;

        window.onload = async function() {
            const pass = prompt("🔑 أدخل كلمة سر الإدارة:");
            if (pass !== "Emoo") {
                alert("❌ كلمة السر غير صحيحة!");
                window.location.href = "index.html";
                return;
            }
            await initAdminButtons();
        };

        async function initAdminButtons() {
            try {
                const settings = await fetchAppSettings();
                isAttendanceOpenState = (settings.isAttendanceOpen === 'true');
                isRegistrationOpenState = (settings.isRegistrationOpen === 'true');
                updateButtonsUI();

                if (settings.currentSubject) {
                    document.getElementById('adminSubjectInput').value = settings.currentSubject;
                }
            } catch (err) {
                console.error("Error init buttons:", err);
            }
        }

        function updateButtonsUI() {
            const attBtn = document.getElementById('toggleAttendanceBtn');
            const regBtn = document.getElementById('toggleRegistrationBtn');

            if (isAttendanceOpenState) {
                attBtn.style.backgroundColor = '#10b981';
                attBtn.textContent = '🟢 الحضور: مفتوح (اضغط للإغلاق)';
            } else {
                attBtn.style.backgroundColor = '#ef4444';
                attBtn.textContent = '🔴 الحضور: مغلق (اضغط للفتح)';
            }

            if (isRegistrationOpenState) {
                regBtn.style.backgroundColor = '#10b981';
                regBtn.textContent = '🟢 إنشاء الحسابات: مفتوح (اضغط للإغلاق)';
            } else {
                regBtn.style.backgroundColor = '#ef4444';
                regBtn.textContent = '🔴 إنشاء الحسابات: مغلق (اضغط للفتح)';
            }
        }

        async function handleToggleAttendance() {
            const attBtn = document.getElementById('toggleAttendanceBtn');
            attBtn.textContent = "⏳ جاري التحديث السحابي...";
            
            isAttendanceOpenState = !isAttendanceOpenState;
            const newValueStr = isAttendanceOpenState ? 'true' : 'false';

            await updateAppSetting('isAttendanceOpen', newValueStr);
            updateButtonsUI();
            alert(`تم تحديث حالة الحضور سحابياً إلى: ${newValueStr === 'true' ? 'مفتوح' : 'مغلق'}`);
        }

        async function handleToggleRegistration() {
            const regBtn = document.getElementById('toggleRegistrationBtn');
            regBtn.textContent = "⏳ جاري التحديث السحابي...";
            
            isRegistrationOpenState = !isRegistrationOpenState;
            const newValueStr = isRegistrationOpenState ? 'true' : 'false';

            await updateAppSetting('isRegistrationOpen', newValueStr);
            updateButtonsUI();
            alert(`تم تحديث حالة التسجيل سحابياً إلى: ${newValueStr === 'true' ? 'مفتوح' : 'مغلق'}`);
        }

        async function saveSubject() {
            const subVal = document.getElementById('adminSubjectInput').value.trim();
            if (!subVal) {
                alert("يرجى إدخال اسم المادة!");
                return;
            }
            await updateAppSetting('currentSubject', subVal);
            alert("تم تحديث اسم المحاضرة في الشيت بنجاح!");
        }
    </script>
</body>
</html>
