<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة - نظام الحضور</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <div class="admin-badge" style="background: rgba(239, 68, 68, 0.1); color: var(--accent-red);">🔐 لوحة الإدارة العليا</div>
        <h2>تحكم النظام</h2>
        <p style="color: var(--text-sub); font-size: 14px; margin-bottom: 20px;">التحكم اللحظي في حالة التسجيل، الحضور، وتغيير المحاضرة الحالية.</p>

        <div class="input-group">
            <label>عنوان المحاضرة الحالية:</label>
            <input type="text" id="adminCurrentSubject" placeholder="مثال: المحاضرة الأولى - مقدمة في الإعلام">
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button type="button" class="btn" onclick="toggleSetting('isAttendanceOpen', 'true')" style="background: var(--accent-green);">فتح الحضور</button>
            <button type="button" class="btn" onclick="toggleSetting('isAttendanceOpen', 'false')" style="background: var(--accent-red);">إغلاق الحضور</button>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button type="button" class="btn" onclick="toggleSetting('isRegistrationOpen', 'true')" style="background: var(--accent-green);">فتح التسجيل</button>
            <button type="button" class="btn" onclick="toggleSetting('isRegistrationOpen', 'false')" style="background: var(--accent-red);">إغلاق التسجيل</button>
        </div>

        <button type="button" class="btn" onclick="saveAdminSettings()" style="background: #4f46e5; margin-bottom: 15px;">💾 حفظ وتحديث الإعدادات سحابياً</button>

        <p id="adminStatusMsg" class="status-msg"></p>

        <button type="button" class="btn btn-secondary" onclick="window.location.href='subjects.html'">العودة للمواد</button>
    </div>

    <script src="script.js"></script>
    <script>
        // حماية صفحة الإدارة بكلمة السر Emoo
        window.onload = async function() {
            const pass = prompt("🔐 أدخل كلمة سر الإدارة (Emoo) للدخول للوحة التحكم:");
            if (pass !== "Emoo") {
                alert("❌ كلمة السر غير صحيحة!");
                window.location.href = 'subjects.html';
                return;
            }

            try {
                const settings = await fetchAppSettings();
                if(settings && settings.currentSubject) {
                    document.getElementById('adminCurrentSubject').value = settings.currentSubject;
                }
            } catch(e) {
                console.error(e);
            }
        };

        async function toggleSetting(key, value) {
            await updateAdminSettingDirect(key, value);
        }

        async function saveAdminSettings() {
            const subjectVal = document.getElementById('adminCurrentSubject').value.trim();
            if(!subjectVal) {
                alert("يرجى كتابة عنوان المحاضرة!");
                return;
            }
            await updateAdminSettingDirect('currentSubject', subjectVal);
        }

        async function updateAdminSettingDirect(key, value) {
            const statusMsg = document.getElementById('adminStatusMsg');
            statusMsg.style.color = "#38bdf8";
            statusMsg.textContent = "⏳ جاري التحديث عبر SheetDB...";

            try {
                await fetch(sheetDBUrl, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: [
                            {
                                [key]: value
                            }
                        ]
                    })
                });

                statusMsg.style.color = "var(--accent-green)";
                statusMsg.textContent = `✅ تم تحديث (${key}) إلى (${value}) بنجاح!`;
                alert(`🎉 تم تحديث الإعدادات بنجاح!`);
            } catch (e) {
                console.error(e);
                statusMsg.style.color = "var(--accent-red)";
                statusMsg.textContent = "❌ حدث خطأ أثناء التحديث.";
            }
        }
    </script>
</body>
</html>
