<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة - كلية الإعلام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>⚙️ لوحة تحكم الإدارة</h2>
        <p id="adminWelcome">مرحباً بك في لوحة النظام</p>

        <div class="card">
            <h3>🔘 التحكم في حالة النظام (سحابياً)</h3>
            <p>اضغط على أي زرار لتغيير حالته فوراً في الشيت وعند الطلاب:</p>
            
            <button id="toggleAttendanceBtn" class="btn" style="background-color: #28a745; margin-bottom: 15px; font-weight: bold; padding: 12px;" onclick="handleToggleAttendance()">
                🔄 جاري جلب حالة الحضور...
            </button>

            <button id="toggleRegistrationBtn" class="btn" style="background-color: #28a745; margin-bottom: 15px; font-weight: bold; padding: 12px;" onclick="handleToggleRegistration()">
                🔄 جاري جلب حالة التسجيل...
            </button>
        </div>

        <div class="card">
            <h3>📚 تحديد المادة الحالية</h3>
            <input type="text" id="adminSubjectInput" placeholder="أدخل اسم المادة الحالية">
            <button class="btn" onclick="saveSubject()">تحديث المادة سحابياً</button>
        </div>

        <button class="btn btn-secondary" onclick="window.location.href='subjects.html'">العودة للرئيسية</button>
    </div>

    <script src="script.js"></script>
    <script>
        let isAttendanceOpenState = true;
        let isRegistrationOpenState = true;

        // عند فتح الصفحة
        window.onload = async function() {
            const pass = prompt("🔑 أدخل كلمة سر الإدارة:");
            if (pass !== "Emoo") {
                alert("❌ كلمة السر غير صحيحة!");
                window.location.href = "index.html";
                return;
            }
            await initAdminButtons();
        };

        // تحميل الحالة الحقيقية من الشيت وتحديث أشكال الأزرار
        async function initAdminButtons() {
            const settings = await fetchAppSettings();
            
            isAttendanceOpenState = (settings.isAttendanceOpen === 'true');
            isRegistrationOpenState = (settings.isRegistrationOpen === 'true');

            updateButtonsUI();

            if (settings.currentSubject) {
                document.getElementById('adminSubjectInput').value = settings.currentSubject;
            }
        }

        // تحديث ألوان ونصوص الأزرار
        function updateButtonsUI() {
            const attBtn = document.getElementById('toggleAttendanceBtn');
            const regBtn = document.getElementById('toggleRegistrationBtn');

            if (isAttendanceOpenState) {
                attBtn.style.backgroundColor = '#28a745';
                attBtn.textContent = '🟢 الحضور: مفتوح (اضغط لإغلاقه)';
            } else {
                attBtn.style.backgroundColor = '#dc3545';
                attBtn.textContent = '🔴 الحضور: مغلق (اضغط لفتحه)';
            }

            if (isRegistrationOpenState) {
                regBtn.style.backgroundColor = '#28a745';
                regBtn.textContent = '🟢 إنشاء الحسابات: مفتوح (اضغط لإغلاقه)';
            } else {
                regBtn.style.backgroundColor = '#dc3545';
                regBtn.textContent = '🔴 إنشاء الحسابات: مغلق (اضغط لفتحه)';
            }
        }

        // إرسال أمر إغلاق/فتح الحضور للشيت
        async function handleToggleAttendance() {
            const attBtn = document.getElementById('toggleAttendanceBtn');
            attBtn.textContent = "⏳ جاري الإرسال للشيت...";
            
            isAttendanceOpenState = !isAttendanceOpenState;
            const newValueStr = isAttendanceOpenState ? 'TRUE' : 'FALSE';

            await updateAppSetting('isAttendanceOpen', newValueStr);
            updateButtonsUI();
            alert(`تم تغيير حالة الحضور في الشيت إلى: ${newValueStr}`);
        }

        // إرسال أمر إغلاق/فتح التسجيل للشيت
        async function handleToggleRegistration() {
            const regBtn = document.getElementById('toggleRegistrationBtn');
            regBtn.textContent = "⏳ جاري الإرسال للشيت...";
            
            isRegistrationOpenState = !isRegistrationOpenState;
            const newValueStr = isRegistrationOpenState ? 'TRUE' : 'FALSE';

            await updateAppSetting('isRegistrationOpen', newValueStr);
            updateButtonsUI();
            alert(`تم تغيير حالة التسجيل في الشيت إلى: ${newValueStr}`);
        }

        // حفظ اسم المادة
        async function saveSubject() {
            const subVal = document.getElementById('adminSubjectInput').value.trim();
            if (!subVal) {
                alert("يرجى إدخال اسم المادة!");
                return;
            }
            await updateAppSetting('currentSubject', subVal);
            alert("تم تحديث اسم المادة في الشيت بنجاح!");
        }
    </script>
</body>
</html>
