<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة الشاملة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 850px;">
        <div class="admin-badge" style="background: rgba(239, 68, 68, 0.1); color: var(--accent-red);">🔐 لوحة الإدارة العليا</div>
        <h2>لوحة التحكم والتحكم السحابي في الصفحات</h2>

        <!-- إحصائيات سريعة للحضور -->
        <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
            <div style="flex:1; background: rgba(56, 189, 248, 0.1); border: 1px solid #38bdf8; padding: 15px; border-radius: 12px; text-align: center;">
                <h4 style="color: #38bdf8; margin-bottom: 5px;">👥 إجمالي الحضور</h4>
                <p id="totalAttendanceCount" style="font-size: 24px; font-weight: bold;">0</p>
            </div>
            <div style="flex:1; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent-green); padding: 15px; border-radius: 12px; text-align: center;">
                <h4 style="color: var(--accent-green); margin-bottom: 5px;">📚 المحاضرة النشطة</h4>
                <p id="activeLectureTitleLabel" style="font-size: 16px; font-weight: bold;">جاري التحميل...</p>
            </div>
        </div>

        <!-- الإعدادات العامة (تحديث صفحة Settings) -->
        <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #38bdf8;">⚙️ إعدادات صفحة Settings (فتح وإغلاق)</h3>
            <div class="input-group">
                <label>عنوان المحاضرة الحالية:</label>
                <input type="text" id="adminCurrentSubject" placeholder="مثال: محاضرة الصحافة">
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                <button type="button" class="btn" onclick="toggleSetting('isAttendanceOpen', 'true')" style="background: var(--accent-green); flex:1;">فتح الحضور</button>
                <button type="button" class="btn" onclick="toggleSetting('isAttendanceOpen', 'false')" style="background: var(--accent-red); flex:1;">إغلاق الحضور</button>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                <button type="button" class="btn" onclick="toggleSetting('isRegistrationOpen', 'true')" style="background: var(--accent-green); flex:1;">فتح التسجيل</button>
                <button type="button" class="btn" onclick="toggleSetting('isRegistrationOpen', 'false')" style="background: var(--accent-red); flex:1;">إغلاق التسجيل</button>
            </div>

            <button type="button" class="btn" onclick="saveAdminSettings()" style="background: #4f46e5;">💾 حفظ إعدادات السيستم</button>
        </div>

        <!-- أزرار الإدارة الكبرى (إصدار السجل وبدء محاضرة جديدة) -->
        <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #38bdf8;">🚀 إدارة السجلات والمحاضرات</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button type="button" class="btn" onclick="exportAttendanceReport()" style="background: #0ea5e9; flex: 1;">📥 إصدار سجل المحاضرة (CSV)</button>
                <button type="button" class="btn" onclick="startNewLectureReset()" style="background: var(--accent-red); flex: 1;">🗑️ حذف سجل الحضور وبداية محاضرة جديدة</button>
            </div>
        </div>

        <!-- إضافة طالب يدوي -->
        <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #38bdf8;">👤 إنشاء حساب طالب يدوي (صفحة Students)</h3>
            <div class="input-group"><input type="text" id="manualName" placeholder="اسم الطالب الرباعي"></div>
            <div class="input-group"><input type="text" id="manualPhone" placeholder="رقم الهاتف"></div>
            <div class="input-group">
                <select id="manualGrade" style="width:100%; padding:10px; background:var(--bg-main); color:var(--text-main); border:1px solid var(--border-color); border-radius:8px;">
                    <option value="الفرقة الأولى">الفرقة الأولى</option>
                    <option value="الفرقة الثانية">الفرقة الثانية</option>
                    <option value="الفرقة الثالثة">الفرقة الثالثة</option>
                    <option value="الفرقة الرابعة">الفرقة الرابعة</option>
                </select>
            </div>
            <div class="input-group"><input type="text" id="manualPassword" placeholder="كلمة السر"></div>
            <button type="button" class="btn" onclick="createManualStudent()" style="background: #8b5cf6;">➕ تسجيل الطالب في الشيت</button>
        </div>

        <!-- سجل الطلاب المسجلين بالكامل والتعديل -->
        <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #38bdf8;">📋 أكونتات الطلاب (صفحة Students) وتعديل بياناتهم</h3>
            <button type="button" class="btn btn-secondary" onclick="loadAdminDashboardData()" style="margin-bottom: 10px;">🔄 تحديث البيانات</button>
            <div id="studentsTableContainer" style="overflow-x: auto; max-height: 350px;">
                <p style="color: var(--text-sub);">جاري التحميل...</p>
            </div>
        </div>

        <p id="adminStatusMsg" class="status-msg"></p>

        <button type="button" class="btn btn-secondary" onclick="window.location.href='subjects.html'">العودة للمواد</button>
    </div>

    <script src="script.js"></script>
    <script>
        window.onload = async function() {
            // كود الإدارة الرئيسي: 44554455
            const pass = prompt("🔐 أدخل الرقم السري الخاص بالإدارة:");
            if (pass !== "44554455") {
                alert("❌ الرقم السري خطأ!");
                window.location.href = 'subjects.html';
                return;
            }

            loadAdminDashboardData();
        };

        async function loadAdminDashboardData() {
            try {
                const settings = await fetchAppSettings();
                if(settings) {
                    document.getElementById('adminCurrentSubject').value = settings.currentSubject || "";
                    document.getElementById('activeLectureTitleLabel').textContent = settings.currentSubject || "المحاضرة الحالية";
                }

                // جلب الحضور لحساب العدد
                const attendanceList = await fetchAttendanceFromSheet();
                document.getElementById('totalAttendanceCount').textContent = attendanceList.length;

                // جلب جدول الطلاب
                const students = await fetchAllStudentsFromSheet();
                const container = document.getElementById('studentsTableContainer');

                if(!students || students.length === 0) {
                    container.innerHTML = "<p style='color:var(--text-sub);'>لا توجد أكونتات طلاب مسجلة في الشيت حالياً.</p>";
                    return;
                }

                let html = `<table style="width:100%; border-collapse:collapse; font-size:13px;">
                    <tr style="background:rgba(255,255,255,0.05); text-align:right;">
                        <th style="padding:8px;">ID</th>
                        <th style="padding:8px;">الاسم</th>
                        <th style="padding:8px;">الهاتف</th>
                        <th style="padding:8px;">الفرقة</th>
                        <th style="padding:8px;">إجراءات</th>
                    </tr>`;

                students.forEach((st) => {
                    if(st.id) {
                        html += `<tr style="border-bottom:1px solid var(--border-color);">
                            <td style="padding:8px;">${st.id}</td>
                            <td style="padding:8px;">${st.name}</td>
                            <td style="padding:8px;">${st.phone}</td>
                            <td style="padding:8px;">${st.grade}</td>
                            <td style="padding:8px; display:flex; gap:5px;">
                                <button onclick="editStudentRow('${st.id}', '${st.name}', '${st.phone}')" style="background:#38bdf8; color:#000; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">تعديل</button>
                                <button onclick="deleteStudentRow('${st.id}')" style="background:var(--accent-red); color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">حذف</button>
                            </td>
                        </tr>`;
                    }
                });
                html += `</table>`;
                container.innerHTML = html;

            } catch(e) {
                console.error(e);
            }
        }

        async function toggleSetting(key, value) {
            await updateAdminSettingDirect(key, value);
        }

        async function saveAdminSettings() {
            const subjectVal = document.getElementById('adminCurrentSubject').value.trim();
            if(!subjectVal) {
                alert("يرجى كتابة عنوان المحاضرة!");
                return;
            }
            await updateAdminSettingDirect('currentSubject', subjectVal);
        }

        async function updateAdminSettingDirect(key, value) {
            const statusMsg = document.getElementById('adminStatusMsg');
            statusMsg.style.color = "#38bdf8";
            statusMsg.textContent = "⏳ جاري التحديث في صفحة Settings بالشيت...";

            try {
                let currentSettings = await fetchAppSettings();
                currentSettings[key] = value;

                // التحديث في صفحة Settings
                await fetch(`${sheetDBUrl}/sheet/Settings`, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: [currentSettings] })
                });

                statusMsg.style.color = "var(--accent-green)";
                statusMsg.textContent = `✅ تم تحديث الإعدادات بنجاح!`;
                alert(`🎉 تم تحديث الحالة وحفظها في صفحة Settings!`);
                loadAdminDashboardData();
            } catch (e) {
                console.error(e);
                statusMsg.style.color = "var(--accent-red)";
                statusMsg.textContent = "❌ حدث خطأ أثناء التحديث.";
            }
        }

        async function createManualStudent() {
            const name = document.getElementById('manualName').value.trim();
            const phone = document.getElementById('manualPhone').value.trim();
            const grade = document.getElementById('manualGrade').value;
            const password = document.getElementById('manualPassword').value.trim();

            if(!name || !phone || !password) {
                alert("املأ جميع بيانات الطالب!");
                return;
            }

            const newId = 'AZ' + Math.floor(100000 + Math.random() * 900000);
            const studentData = { id: newId, name, phone, grade, password, boundDeviceId: 'DEV-MANUAL' };

            localStorage.setItem(newId, JSON.stringify(studentData));

            try {
                await fetch(`${sheetDBUrl}/sheet/Students`, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: [studentData] })
                });
                alert(`🎉 تم إضافة الطالب بنجاح لصفحة Students!\nالرقم الجامعي: ${newId}`);
                loadAdminDashboardData();
            } catch(e) {
                alert("حدث خطأ أثناء الإرسال للشيت.");
            }
        }

        async function deleteStudentRow(studentId) {
            if(confirm(`هل أنت متأكد من حذف الطالب ذو الـ ID: ${studentId}؟`)) {
                try {
                    await fetch(`${sheetDBUrl}/sheet/Students/id/${studentId}`, { method: 'DELETE' });
                    localStorage.removeItem(studentId);
                    alert("🗑️ تم الحذف بنجاح!");
                    loadAdminDashboardData();
                } catch(e) {
                    alert("❌ حدث خطأ أثناء الحذف.");
                }
            }
        }

        async function editStudentRow(studentId, currentName, currentPhone) {
            const newName = prompt(`تعديل اسم الطالب (ID: ${studentId}):`, currentName);
            if(newName) {
                try {
                    await fetch(`${sheetDBUrl}/sheet/Students/id/${studentId}`, {
                        method: 'PATCH',
                        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName })
                    });
                    alert("✏️ تم التعديل بنجاح!");
                    loadAdminDashboardData();
                } catch(e) {
                    alert("❌ حدث خطأ أثناء التعديل.");
                }
            }
        }

        // إصدار وتصدير تقرير وحفظه كملف CSV
        async function exportAttendanceReport() {
            const attendanceList = await fetchAttendanceFromSheet();
            if(!attendanceList || attendanceList.length === 0) {
                alert("لا توجد سجلات حضور لتصديرها حالياً!");
                return;
            }

            let csvContent = "\uFEFFID,Name,Phone,Grade,Subject,Time,LocationLink,Status\n";
            attendanceList.forEach(row => {
                csvContent += `"${row.id}","${row.name}","${row.phone}","${row.grade}","${row.subject}","${row.time}","${row.locationLink}","${row.status}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `Attendance_Report_${Date.now()}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // تفريغ وحذف سجل الحضور للبدء بمحاضرة جديدة نظيفة
        async function startNewLectureReset() {
            if(confirm("⚠️ هل أنت متأكد من بدء محاضرة جديدة وتصفير سجل الحضور بالكامل؟ سيتم مسح صفحة Attendance.")) {
                try {
                    // تفريغ صفحة Attendance في الشيت
                    await fetch(`${sheetDBUrl}/sheet/Attendance/all`, { method: 'DELETE' });
                    alert("🗑️ تم تفريغ سجل الحضور بنجاح وأصبح الشيت جاهزاً لمحاضرة جديدة بيضاء نظيفة!");
                    loadAdminDashboardData();
                } catch(e) {
                    alert("❌ حدث خطأ، يرجى مسح سجل الحضور يدوياً من الشيت إذا لزم الأمر.");
                }
            }
        }
    </script>
</body>
</html>
