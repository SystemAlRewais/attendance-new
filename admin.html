<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة - كلية الإعلام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>⚙️ لوحة تحكم الإدارة</h2>
        <p id="adminWelcome">مرحباً بك في لوحة النظام</p>

        <div class="card">
            <h3>🔘 التحكم في حالة النظام (سحابياً)</h3>
            <p>اضغط على أي زرار لتغيير حالته فوراً في الشيت وعند الطلاب:</p>
            
            <button id="toggleAttendanceBtn" class="btn" style="background-color: #28a745; margin-bottom: 10px;" onclick="toggleAttendance()">
                🟢 الحضور: مفتوح (اضغط للإغلاق)
            </button>

            <button id="toggleRegistrationBtn" class="btn" style="background-color: #28a745; margin-bottom: 10px;" onclick="toggleRegistration()">
                🟢 إنشاء الحسابات: مفتوح (اضغط للإغلاق)
            </button>
        </div>

        <div class="card">
            <h3>📚 تحديد المادة الحالية</h3>
            <input type="text" id="adminSubjectInput" placeholder="أدخل اسم المادة الحالية">
            <button class="btn" onclick="saveSubject()">تحديث المادة سحابياً</button>
        </div>

        <div class="card">
            <h3>📊 سجل الحضور العام</h3>
            <button class="btn btn-secondary" onclick="loadAttendanceLogs()">تحديث سجل الحضور</button>
            <div id="attendanceTableContainer" style="margin-top: 15px; overflow-x: auto;">
                <p>جاري تحميل السجل...</p>
            </div>
        </div>

        <button class="btn btn-secondary" onclick="window.location.href='subjects.html'">العودة للرئيسية</button>
    </div>

    <script src="script.js"></script>
    <script>
        // التثبت من كلمة سر الإدارة عند الدخول
        window.onload = async function() {
            const pass = prompt("🔑 أدخل كلمة سر الإدارة للوصول للوحة التحكم:");
            if (pass !== "Emoo") {
                alert("❌ كلمة السر غير صحيحة!");
                window.location.href = "index.html";
                return;
            }
            refreshAdminUI();
        };

        let currentSettings = {
            isAttendanceOpen: 'true',
            isRegistrationOpen: 'true',
            currentSubject: 'المحاضرة الأولى'
        };

        // تحديث واجهة الأزرار من الشيت
        async function refreshAdminUI() {
            currentSettings = await fetchAppSettings();
            
            const attBtn = document.getElementById('toggleAttendanceBtn');
            const regBtn = document.getElementById('toggleRegistrationBtn');
            const subInput = document.getElementById('adminSubjectInput');

            if (currentSettings.isAttendanceOpen === 'true') {
                attBtn.style.backgroundColor = '#28a745';
                attBtn.textContent = '🟢 الحضور: مفتوح (اضغط للإغلاق)';
            } else {
                attBtn.style.backgroundColor = '#dc3545';
                attBtn.textContent = '🔴 الحضور: مغلق (اضغط للفتح)';
            }

            if (currentSettings.isRegistrationOpen === 'true') {
                regBtn.style.backgroundColor = '#28a745';
                regBtn.textContent = '🟢 إنشاء الحسابات: مفتوح (اضغط للإغلاق)';
            } else {
                regBtn.style.backgroundColor = '#dc3545';
                regBtn.textContent = '🔴 إنشاء الحسابات: مغلق (اضغط للفتح)';
            }

            if (subInput && currentSettings.currentSubject) {
                subInput.value = currentSettings.currentSubject;
            }

            loadAttendanceLogs();
        }

        // تبديل حالة الحضور (فتح / إغلاق)
        async function toggleAttendance() {
            const attBtn = document.getElementById('toggleAttendanceBtn');
            attBtn.textContent = "جاري التحديث سحابياً...";
            
            const newStatus = currentSettings.isAttendanceOpen === 'true' ? 'false' : 'true';
            await updateAppSetting('isAttendanceOpen', newStatus);
            currentSettings.isAttendanceOpen = newStatus;
            
            refreshAdminUI();
            alert(`تم ${newStatus === 'true' ? 'فتح' : 'إغلاق'} الحضور سحابياً بنجاح!`);
        }

        // تبديل حالة إنشاء الحسابات (فتح / إغلاق)
        async function toggleRegistration() {
            const regBtn = document.getElementById('toggleRegistrationBtn');
            regBtn.textContent = "جاري التحديث سحابياً...";
            
            const newStatus = currentSettings.isRegistrationOpen === 'true' ? 'false' : 'true';
            await updateAppSetting('isRegistrationOpen', newStatus);
            currentSettings.isRegistrationOpen = newStatus;
            
            refreshAdminUI();
            alert(`تم ${newStatus === 'true' ? 'فتح' : 'إغلاق'} إنشاء الحسابات سحابياً بنجاح!`);
        }

        // حفظ المادة الحالية سحابياً
        async function saveSubject() {
            const subVal = document.getElementById('adminSubjectInput').value.trim();
            if (!subVal) {
                alert("يرجى إدخال اسم المادة!");
                return;
            }
            await updateAppSetting('currentSubject', subVal);
            alert("تم تحديث اسم المادة سحابياً بنجاح!");
        }

        // تحميل كشف الحضور من الشيت
        async function loadAttendanceLogs() {
            const container = document.getElementById('attendanceTableContainer');
            try {
                const response = await fetch(sheetDbApiUrl + "?sheet=Attendance");
                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = "<p>لا يوجد سجلات حضور حتى الآن.</p>";
                    return;
                }

                let html = `<table border="1" style="width:100%; text-align:center; border-collapse:collapse;">
                    <thead>
                        <tr style="background-color:#f2f2f2;">
                            <th>ID</th>
                            <th>الاسم</th>
                            <th>المادة</th>
                            <th>الوقت</th>
                            <th>الموقع</th>
                        </tr>
                    </thead>
                    <tbody>`;

                data.reverse().forEach(row => {
                    html += `<tr>
                        <td>${row.id || '-'}</td>
                        <td>${row.name || '-'}</td>
                        <td>${row.subject || '-'}</td>
                        <td>${row.time || '-'}</td>
                        <td><a href="${row.locationLink}" target="_blank">رابط الخريطة</a></td>
                    </tr>`;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = "<p>حدث خطأ أثناء تحميل السجل سحابياً.</p>";
            }
        }
    </script>
</body>
</html>
