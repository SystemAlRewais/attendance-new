<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السحابية - كلية الإعلام</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 650px;">
        <div class="admin-badge">⚡ لوحة الإدارة العليا</div>
        <h2>إدارة النظام السحابي</h2>
        <p id="adminWelcome">تحكم لحظي في الحالة الأكاديمية وقاعدة البيانات</p>

        <div class="card">
            <h3>🔘 حالة بوابات النظام (سحابياً)</h3>
            <button id="toggleAttendanceBtn" class="btn" style="background-color: #10b981; margin-bottom: 12px; font-weight: bold; padding: 12px;" onclick="handleToggleAttendance()">
                🔄 جاري جلب حالة الحضور...
            </button>

            <button id="toggleRegistrationBtn" class="btn" style="background-color: #10b981; margin-bottom: 12px; font-weight: bold; padding: 12px;" onclick="handleToggleRegistration()">
                🔄 جاري جلب حالة التسجيل...
            </button>
        </div>

        <div class="card">
            <h3>📚 المادة والمحاضرة الحالية</h3>
            <div class="input-group">
                <input type="text" id="adminSubjectInput" placeholder="أدخل اسم المحاضرة النشطة حالياً">
            </div>
            <button class="btn" onclick="saveSubject()">تحديث اسم المادة سحابياً</button>
        </div>

        <div class="card">
            <h3>👥 قاعدة بيانات الطلاب المسجلين سحابياً</h3>
            <button class="btn" style="background-color: #0ea5e9; margin-bottom: 12px;" onclick="loadStudentsTable()">🔄 تحميل/تحديث جدول الطلاب</button>
            <div style="max-height: 250px; overflow-y: auto;">
                <table id="studentsTable">
                    <tr>
                        <th>ID</th>
                        <th>الاسم</th>
                        <th>الهاتف</th>
                        <th>الفرقة</th>
                        <th>الباسورد</th>
                    </tr>
                </table>
            </div>
        </div>

        <button class="btn btn-secondary" onclick="window.location.href='subjects.html'">العودة لمنصة المواد</button>
    </div>

    <script src="script.js"></script>
    <script>
        let isAttendanceOpenState = true;
        let isRegistrationOpenState = true;

        window.onload = async function() {
            const pass = prompt("🔑 أدخل كلمة سر الإدارة:");
            if (pass !== "Emoo") {
                alert("❌ كلمة السر غير صحيحة!");
                window.location.href = "index.html";
                return;
            }
            await initAdminButtons();
            await loadStudentsTable();
        };

        async function initAdminButtons() {
            try {
                const settings = await fetchAppSettings();
                isAttendanceOpenState = (String(settings.isAttendanceOpen).trim() === 'true');
                isRegistrationOpenState = (String(settings.isRegistrationOpen).trim() === 'true');
                updateButtonsUI();

                if (settings.currentSubject) {
                    document.getElementById('adminSubjectInput').value = settings.currentSubject;
                }
            } catch (err) {
                console.error("Error init buttons:", err);
            }
        }

        function updateButtonsUI() {
            const attBtn = document.getElementById('toggleAttendanceBtn');
            const regBtn = document.getElementById('toggleRegistrationBtn');

            if (isAttendanceOpenState) {
                attBtn.style.backgroundColor = '#10b981';
                attBtn.textContent = '🟢 الحضور: مفتوح (اضغط للإغلاق)';
            } else {
                attBtn.style.backgroundColor = '#ef4444';
                attBtn.textContent = '🔴 الحضور: مغلق (اضغط للفتح)';
            }

            if (isRegistrationOpenState) {
                regBtn.style.backgroundColor = '#10b981';
                regBtn.textContent = '🟢 إنشاء الحسابات: مفتوح (اضغط للإغلاق)';
            } else {
                regBtn.style.backgroundColor = '#ef4444';
                regBtn.textContent = '🔴 إنشاء الحسابات: مغلق (اضغط للفتح)';
            }
        }

        async function handleToggleAttendance() {
            isAttendanceOpenState = !isAttendanceOpenState;
            const newValueStr = isAttendanceOpenState ? 'true' : 'false';
            await updateAppSetting('isAttendanceOpen', newValueStr);
            updateButtonsUI();
            alert(`تم تغيير حالة الحضور إلى: ${newValueStr === 'true' ? 'مفتوح' : 'مغلق'}`);
        }

        async function handleToggleRegistration() {
            isRegistrationOpenState = !isRegistrationOpenState;
            const newValueStr = isRegistrationOpenState ? 'true' : 'false';
            await updateAppSetting('isRegistrationOpen', newValueStr);
            updateButtonsUI();
            alert(`تم تغيير حالة التسجيل إلى: ${newValueStr === 'true' ? 'مفتوح' : 'مغلق'}`);
        }

        async function saveSubject() {
            const subVal = document.getElementById('adminSubjectInput').value.trim();
            if (!subVal) {
                alert("يرجى إدخال اسم المادة!");
                return;
            }
            await updateAppSetting('currentSubject', subVal);
            alert("تم تحديث اسم المحاضرة بنجاح!");
        }

        async function loadStudentsTable() {
            const table = document.getElementById('studentsTable');
            table.innerHTML = `<tr><th>ID</th><th>الاسم</th><th>الهاتف</th><th>الفرقة</th><th>الباسورد</th></tr>`;
            
            const rows = await fetchAllStudents();
            if (rows && rows.length > 1) {
                for (let i = 1; i < rows.length; i++) {
                    const r = rows[i];
                    if(r[0]) {
                        table.innerHTML += `<tr>
                            <td>${r[0]}</td>
                            <td>${r[1]}</td>
                            <td>${r[2]}</td>
                            <td>${r[3]}</td>
                            <td>${r[4]}</td>
                        </tr>`;
                    }
                }
            } else {
                table.innerHTML += `<tr><td colspan="5">لا توجد بيانات طلاب مسجلة بعد</td></tr>`;
            }
        }
    </script>
</body>
</html>
