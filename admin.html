<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة الشاملة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <div class="admin-badge" style="background: rgba(239, 68, 68, 0.1); color: var(--accent-red);">🔐 لوحة الإدارة العليا</div>
        <h2>لوحة التحكم والتحكم السحابي للمواد</h2>

        <!-- إعدادات المادة وحالة الحضور -->
        <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #38bdf8;">📚 اختيار المادة والمحاضرة</h3>
            
            <div class="input-group">
                <label>اختر المادة:</label>
                <select id="adminSubjectSelect" style="width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; border-radius: 8px; margin-bottom: 10px;">
                    <option value="نشأة وسائل الاتصال">نشأة وسائل الاتصال</option>
                    <option value="رأي عام">رأي عام</option>
                    <option value="صحافة استقصائية">صحافة استقصائية</option>
                    <option value="إذاعة وتلفزيون">إذاعة وتلفزيون</option>
                    <option value="إعلان وتبرع">إعلان وترويج</option>
                </select>
            </div>

            <div class="input-group">
                <label>عنوان المحاضرة:</label>
                <input type="text" id="adminCurrentSubject" placeholder="مثال: المحاضرة الأولى">
            </div>
            
            <button type="button" class="btn" onclick="saveSubjectAndSettings()" style="background: #4f46e5; margin-bottom: 15px;">💾 حفظ إعدادات المادة والمحاضرة</button>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-size:14px; color:var(--text-sub);">التحكم في تسجيل الحضور للمادة المختارة:</label>
                <div style="display: flex; gap: 10px;">
                    <button type="button" id="btnToggleAttendance" class="btn" onclick="toggleAttendanceState()" style="flex:1; background: #10b981;">🟢 فتح / إغلاق الحضور</button>
                </div>
                <p id="attendanceStatusIndicator" style="margin-top: 8px; font-weight: bold; font-size: 13px;"></p>
            </div>
        </div>

        <!-- سجل الحضور الحي -->
        <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #10b981;">📊 سجل حضور المحاضرة الحالية</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button type="button" class="btn btn-secondary" onclick="loadLiveAttendanceLog()" style="flex:1;">🔄 تحديث السجل</button>
                <button type="button" class="btn" onclick="endLectureAndExport()" style="background: var(--accent-red); flex:1;">🛑 إنهاء المحاضرة وأرشفة التقرير</button>
            </div>
            <div id="liveAttendanceContainer" style="overflow-x: auto; max-height: 250px;">
                <p style="color: var(--text-sub);">اضغط على تحديث لعرض الحضور...</p>
            </div>
        </div>

        <!-- أرشيف التقارير -->
        <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #38bdf8;">📁 أرشيف التقارير السابقة</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;">
                <button type="button" class="btn btn-secondary" onclick="loadArchiveReports()" style="flex:1;">🔄 تحديث الأرشيف</button>
                <button type="button" class="btn" onclick="downloadArchive()" style="background: #10b981; flex:1;">📥 تحميل الأرشيف</button>
                <button type="button" class="btn" onclick="clearArchive()" style="background: var(--accent-red); flex:1;">🗑️ حذف الأرشيف</button>
            </div>
            <div id="archiveContainer" style="overflow-x: auto; max-height: 200px;">
                <p style="color: var(--text-sub);">لا توجد تقارير مؤرشفة بعد.</p>
            </div>
        </div>

        <!-- إدارة الطلاب -->
        <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px;">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #38bdf8;">📋 إدارة بيانات الطلاب (تحكم كامل)</h3>
            <button type="button" class="btn btn-secondary" onclick="loadStudentsList()" style="margin-bottom: 10px;">🔄 تحديث قائمة الطلاب</button>
            <div id="studentsTableContainer" style="overflow-x: auto; max-height: 350px;">
                <p style="color: var(--text-sub);">اضغط على تحديث لعرض الطلاب...</p>
            </div>
        </div>

        <p id="adminStatusMsg" class="status-msg"></p>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='subjects.html'">العودة للمواد</button>
    </div>

    <script src="script.js"></script>
    <script>
        let currentAttendanceState = "true";

        window.onload = async function() {
            const pass = prompt("🔐 أدخل الرقم السري الخاص بالإدارة:");
            if (pass !== "44554455") {
                alert("❌ الرقم السري غير صحيح!");
                window.location.href = 'subjects.html';
                return;
            }

            try {
                const settings = await fetchAppSettings();
                if(settings) {
                    if(settings.currentSubject) document.getElementById('adminCurrentSubject').value = settings.currentSubject;
                    if(settings.selectedSubject) document.getElementById('adminSubjectSelect').value = settings.selectedSubject;
                    currentAttendanceState = settings.isAttendanceOpen !== undefined ? String(settings.isAttendanceOpen) : "true";
                    updateAttendanceIndicator();
                }
                loadStudentsList();
                loadLiveAttendanceLog();
                loadArchiveReports();
            } catch(e) {
                console.error(e);
            }
        };

        function updateAttendanceIndicator() {
            const indicator = document.getElementById('attendanceStatusIndicator');
            const btn = document.getElementById('btnToggleAttendance');
            if(currentAttendanceState === "true") {
                indicator.style.color = "var(--accent-green)";
                indicator.textContent = "🟢 الحالة الحالية: تسجيل الحضور متاح ومفتوح للطلاب.";
                btn.textContent = "🔴 إغلاق تسجيل الحضور";
                btn.style.background = "var(--accent-red)";
            } else {
                indicator.style.color = "var(--accent-red)";
                indicator.textContent = "🔴 الحالة الحالية: تسجيل الحضور مغلق حالياً.";
                btn.textContent = "🟢 فتح تسجيل الحضور";
                btn.style.background = "var(--accent-green)";
            }
        }

        async function saveSubjectAndSettings() {
            const subjectName = document.getElementById('adminSubjectSelect').value;
            const lectureTitle = document.getElementById('adminCurrentSubject').value.trim();
            if(!lectureTitle) {
                alert("يرجى كتابة عنوان المحاضرة!");
                return;
            }
            await updateCloudSettings({
                selectedSubject: subjectName,
                currentSubject: lectureTitle,
                isAttendanceOpen: currentAttendanceState
            });
        }

        async function toggleAttendanceState() {
            currentAttendanceState = (currentAttendanceState === "true") ? "false" : "true";
            const subjectName = document.getElementById('adminSubjectSelect').value;
            const lectureTitle = document.getElementById('adminCurrentSubject').value.trim() || "محاضرة عامة";
            
            await updateCloudSettings({
                selectedSubject: subjectName,
                currentSubject: lectureTitle,
                isAttendanceOpen: currentAttendanceState
            });
            updateAttendanceIndicator();
        }

        async function updateCloudSettings(settingsObj) {
            const statusMsg = document.getElementById('adminStatusMsg');
            statusMsg.style.color = "#38bdf8";
            statusMsg.textContent = "⏳ جاري حفظ وتحديث الإعدادات سحابياً...";

            try {
                await fetch(`${sheetDBUrl}?sheet=Setting`, { method: 'DELETE', body: JSON.stringify({ query: { id: "*" } }) }).catch(()=>{});
                
                await fetch(`${sheetDBUrl}?sheet=Setting`, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: [settingsObj] })
                });

                statusMsg.style.color = "var(--accent-green)";
                statusMsg.textContent = "✅ تم تحديث وحفظ الإعدادات بنجاح!";
                alert("✔️ تم تحديث الحالة والمادة بنجاح في السحابة!");
            } catch (e) {
                console.error(e);
                statusMsg.style.color = "var(--accent-red)";
                statusMsg.textContent = "❌ حدث خطأ أثناء الاتصال.";
            }
        }

        async function loadLiveAttendanceLog() {
            const container = document.getElementById('liveAttendanceContainer');
            container.innerHTML = "جاري جلب سجل حضور المحاضرة...";
            try {
                const response = await fetch(`${sheetDBUrl}?sheet=attendance`, { cache: "no-store" });
                const data = await response.json();
                if(!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = "<p style='color:var(--text-sub);'>لا توجد سجلات حضور مسجلة حتى الآن.</p>";
                    return;
                }

                let html = `<table style="width:100%; border-collapse:collapse; font-size:13px;">
                    <tr style="background:rgba(255,255,255,0.05); text-align:right;">
                        <th style="padding:8px;">اسم الطالب</th>
                        <th style="padding:8px;">المادة</th>
                        <th style="padding:8px;">وقت التسجيل</th>
                        <th style="padding:8px;">إجراء</th>
                    </tr>`;

                data.forEach((row) => {
                    if(row.name) {
                        html += `<tr style="border-bottom:1px solid var(--border-color);">
                            <td style="padding:8px; font-weight:bold; color:#38bdf8;">${row.name}</td>
                            <td style="padding:8px;">${row.subject || '-'}</td>
                            <td style="padding:8px; font-size:11px;">${row.time || '-'}</td>
                            <td style="padding:8px;"><button onclick="deleteAttendanceRow('${row.name}')" style="background:var(--accent-red); color:#fff; border:none; padding:3px 6px; border-radius:4px;">حذف</button></td>
                        </tr>`;
                    }
                });
                html += `</table>`;
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = "<p style='color:var(--accent-red);'>فشل في جلب سجل الحضور.</p>";
            }
        }

        async function deleteAttendanceRow(name) {
            if(confirm(`هل تريد حذف الطالب ${name} من الحضور الحالي؟`)) {
                await fetch(`${sheetDBUrl}/name/${encodeURIComponent(name)}?sheet=attendance`, { method: 'DELETE' }).catch(()=>{});
                loadLiveAttendanceLog();
            }
        }

        async function endLectureAndExport() {
            if(confirm("🛑 هل أنت متأكد من إنهاء المحاضرة؟ سيتم أرشفة الحضور الحالي وتفريغ السجل.")) {
                try {
                    const res = await fetch(`${sheetDBUrl}?sheet=attendance`, { cache: "no-store" });
                    const currentAttendance = await res.json();

                    if(Array.isArray(currentAttendance) && currentAttendance.length > 0) {
                        const lectureTitle = document.getElementById('adminCurrentSubject').value || "محاضرة عامة";
                        const subName = document.getElementById('adminSubjectSelect').value;
                        const archiveEntry = {
                            lectureName: `${subName} - ${lectureTitle}`,
                            date: new Date().toLocaleString('ar-EG'),
                            totalStudents: currentAttendance.length,
                            details: JSON.stringify(currentAttendance.map(a => a.name))
                        };

                        await fetch(`${sheetDBUrl}?sheet=Archive`, {
                            method: 'POST',
                            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                            body: JSON.stringify({ data: [archiveEntry] })
                        }).catch(()=>{});
                    }

                    for(let row of currentAttendance) {
                        if(row.name) {
                            await fetch(`${sheetDBUrl}/name/${encodeURIComponent(row.name)}?sheet=attendance`, { method: 'DELETE' }).catch(()=>{});
                        }
                    }

                    alert("📊 تم أرشفة التقرير وتفريغ السجل للمحاضرة الجديدة بنجاح!");
                    loadLiveAttendanceLog();
                    loadArchiveReports();
                } catch(e) {
                    alert("❌ حدث خطأ أثناء الأرشفة.");
                }
            }
        }

        async function loadArchiveReports() {
            const container = document.getElementById('archiveContainer');
            try {
                const response = await fetch(`${sheetDBUrl}?sheet=Archive`, { cache: "no-store" });
                const data = await response.json();
                if(!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = "<p style='color:var(--text-sub);'>لا توجد تقارير مؤرشفة سابقة.</p>";
                    return;
                }

                let html = `<table style="width:100%; border-collapse:collapse; font-size:13px;">
                    <tr style="background:rgba(255,255,255,0.05); text-align:right;">
                        <th style="padding:8px;">المحاضرة</th>
                        <th style="padding:8px;">التاريخ</th>
                        <th style="padding:8px;">العدد</th>
                        <th style="padding:8px;">الطلاب</th>
                        <th style="padding:8px;">إجراء</th>
                    </tr>`;

                data.forEach((row) => {
                    if(row.lectureName) {
                        html += `<tr style="border-bottom:1px solid var(--border-color);">
                            <td style="padding:8px; font-weight:bold; color:#38bdf8;">${row.lectureName}</td>
                            <td style="padding:8px; font-size:11px;">${row.date || '-'}</td>
                            <td style="padding:8px; color:var(--accent-green);">${row.totalStudents || 0}</td>
                            <td style="padding:8px; font-size:11px;">${row.details || '-'}</td>
                            <td style="padding:8px;"><button onclick="deleteArchiveItem('${row.lectureName}')" style="background:var(--accent-red); color:#fff; border:none; padding:3px 6px; border-radius:4px;">حذف</button></td>
                        </tr>`;
                    }
                });
                html += `</table>`;
                container.innerHTML = html;
            } catch(e) {
                container.innerHTML = "<p style='color:var(--text-sub);'>الأرشيف فارغ.</p>";
            }
        }

        async function deleteArchiveItem(lectureName) {
            if(confirm(`هل تريد حذف تقرير المحاضرة "${lectureName}" من الأرشيف؟`)) {
                await fetch(`${sheetDBUrl}/lectureName/${encodeURIComponent(lectureName)}?sheet=Archive`, { method: 'DELETE' }).catch(()=>{});
                loadArchiveReports();
            }
        }

        async function downloadArchive() {
            try {
                const response = await fetch(`${sheetDBUrl}?sheet=Archive`, { cache: "no-store" });
                const data = await response.json();
                if(!Array.isArray(data) || data.length === 0) {
                    alert("لا توجد بيانات لتحميلها.");
                    return;
                }
                let csv = "LectureName,Date,TotalStudents,Details\n";
                data.forEach(row => {
                    csv += `"${row.lectureName || ''}","${row.date || ''}","${row.totalStudents || 0}","${(row.details || '').replace(/"/g, '""')}"\n`;
                });
                const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Archive_Report.csv';
                a.click();
            } catch(e) {
                alert("حدث خطأ أثناء التحميل.");
            }
        }

        async function clearArchive() {
            if(confirm("⚠️ هل أنت متأكد من مسح كافة صفوف الأرشيف؟")) {
                try {
                    await fetch(`${sheetDBUrl}?sheet=Archive`, { method: 'DELETE', body: JSON.stringify({ query: { lectureName: "*" } }) }).catch(()=>{});
                    alert("🗑️ تم مسح الأرشيف بالكامل بنجاح!");
                    loadArchiveReports();
                } catch(e) {
                    alert("❌ حدث خطأ أثناء مسح الأرشيف.");
                }
            }
        }

        async function loadStudentsList() {
            const container = document.getElementById('studentsTableContainer');
            const students = await fetchAllStudentsFromSheet();
            if(!students || students.length === 0) {
                container.innerHTML = "<p style='color:var(--text-sub);'>لا توجد طلاب مسجلة.</p>";
                return;
            }
            let html = `<table style="width:100%; border-collapse:collapse; font-size:13px;">
                <tr style="background:rgba(255,255,255,0.05); text-align:right;">
                    <th style="padding:8px;">ID</th><th style="padding:8px;">الاسم</th><th style="padding:8px;">الهاتف</th><th style="padding:8px;">الفرقة</th><th style="padding:8px;">كلمة السر</th><th style="padding:8px;">تحكم</th>
                </tr>`;
            students.forEach((st) => {
                if(st.id) {
                    html += `<tr style="border-bottom:1px solid var(--border-color);">
                        <td style="padding:8px; font-weight:bold; color:#38bdf8;">${st.id}</td>
                        <td style="padding:8px;">${st.name}</td>
                        <td style="padding:8px;">${st.phone}</td>
                        <td style="padding:8px;">${st.grade || '-'}</td>
                        <td style="padding:8px;">${st.password || '-'}</td>
                        <td style="padding:8px;"><button onclick="deleteStudentRow('${st.id}')" style="background:var(--accent-red); color:#fff; border:none; padding:3px 6px; border-radius:4px;">حذف</button></td>
                    </tr>`;
                }
            });
            html += `</table>`;
            container.innerHTML = html;
        }

        async function deleteStudentRow(id) {
            if(confirm(`هل أنت متأكد من حذف الطالب ذو الـ ID: ${id} نهائياً؟`)) {
                await fetch(`${sheetDBUrl}/id/${id}?sheet=students`, { method: 'DELETE' }).catch(()=>{});
                localStorage.removeItem(id);
                loadStudentsList();
            }
        }
    </script>
</body>
</html>
